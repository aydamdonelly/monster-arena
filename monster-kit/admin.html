<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Snappymon · Kontrolle</title>
  <style>
    body { margin: 0; font: 14px/1.35 -apple-system, system-ui, sans-serif; background: #f4f6f5; color: #111; }
    header { position: sticky; top: 0; background: #111; color: #fff; padding: 10px 16px; display: flex; gap: 16px; align-items: center; z-index: 2; flex-wrap: wrap; }
    header b { font-size: 16px; } header span { opacity: .85; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; padding: 14px; }
    .card { background: #fff; border: 2px solid #111; border-radius: 14px; overflow: hidden; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; background: #e8f1ec; }
    .pair img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .info { padding: 8px 10px; } .info h3 { margin: 0 0 2px; font-size: 15px; } .muted { color: #666; font-size: 12px; }
    .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-right: 4px; background: #eee; }
    .tag.egg { background: #ffd60a; } .tag.hatched { background: #4cb867; color: #fff; } .tag.rejected { background: #ff6b4a; color: #fff; } .tag.wait { background: #9a7bf0; color: #fff; }
    button { border: 2px solid #111; background: #fff; border-radius: 8px; padding: 4px 9px; font-weight: 700; cursor: pointer; margin: 6px 6px 0 0; }
    button:hover { background: #ffd60a; }
  </style>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
  <header><b>Snappymon · Kontrolle</b><span id="sum">lade …</span><label><input type="checkbox" id="tests" /> Testspieler zeigen</label><button id="reload">Neu laden</button></header>
  <div id="grid"></div>
  <script type="module">
    // Zeigt jedes Ei mit Foto und dem versteckten Monster. Aufruf: admin.html?key=<ADMIN_KEY>
    import * as THREE from 'three';
    import { buildMonster, updateMonster } from './monster.js';
    const P = new URLSearchParams(location.search);
    // Der Schlüssel steht nie in der Adresse: Er wird einmal eingetippt und nur für diese Browser-Sitzung gemerkt.
    let KEY = ''; try { KEY = sessionStorage.getItem('snappymon-admin') || ''; } catch {}
    const CONVEX = P.get('convex') || 'https://superb-buzzard-616.convex.cloud';
    const call = async (kind, path, args) => { const r = await fetch(`${CONVEX}/api/${kind}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path, args, format: 'json' }) }); const j = await r.json(); if (j.status !== 'success') throw new Error(j.errorMessage || 'Fehler'); return j.value; };
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); renderer.setPixelRatio(1); renderer.setSize(360, 360);
    const scene = new THREE.Scene(); const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    scene.add(new THREE.HemisphereLight('#ffffff', '#cfdcd4', 1.5)); const sun = new THREE.DirectionalLight('#ffffff', 2.0); sun.position.set(-3, 5, 4); scene.add(sun); const fill = new THREE.DirectionalLight('#fff4ec', 0.9); fill.position.set(1.5, 1.5, 6); scene.add(fill);
    function snapshot(genome) {
      try { const m = buildMonster(genome); m.rotation.y = -0.35; scene.add(m); updateMonster(m, 0.4); const h = m.userData.monster.height; const tan = Math.tan((camera.fov * Math.PI) / 360); const d = Math.max((h * 1.3) / (2 * tan), 3.4 / (2 * tan)); camera.position.set(0, h * 0.62, d); camera.lookAt(0, h * 0.47, 0); renderer.render(scene, camera); const url = renderer.domElement.toDataURL('image/png'); scene.remove(m); return url; } catch (e) { return ''; }
    }
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    async function load() {
      const rows = P.get('file') ? await (await fetch('./' + P.get('file'))).json() : await call('query', 'eggs:adminGallery', { key: KEY, since: Date.now() - 24 * 3600 * 1000 });
      const showTests = document.getElementById('tests').checked; const list = rows.filter((r) => showTests || !r.isTest);
      const real = rows.filter((r) => !r.isTest);
      document.getElementById('sum').textContent = `${real.length} echte Einträge · ${real.filter((r) => r.status === 'egg' && r.ready).length} fertige Eier · ${real.filter((r) => r.status === 'egg' && !r.ready).length} in Arbeit · ${real.filter((r) => r.status === 'rejected').length} abgelehnt · ${rows.length - real.length} Test`;
      const grid = document.getElementById('grid'); grid.innerHTML = '';
      for (const r of list) {
        const g = r.genome; const img = g ? snapshot(g) : '';
        const card = document.createElement('div'); card.className = 'card';
        const state = r.status === 'egg' && !r.ready ? '<span class="tag wait">wird gebaut</span>' : `<span class="tag ${esc(r.status)}">${esc(r.status)}</span>`;
        card.innerHTML = `<div class="pair">${r.photoUrl ? `<img src="${esc(r.photoUrl)}" loading="lazy">` : '<div></div>'}${img ? `<img src="${img}">` : '<div></div>'}</div>
          <div class="info"><h3>${esc(g?.name || '…')}</h3><div class="muted">${esc(g?.object || '')}</div>
          <div style="margin-top:4px">${state}${r.golden ? '<span class="tag egg">golden</span>' : ''}${r.isTest ? '<span class="tag">test</span>' : ''}<span class="muted">${esc(r.owner || 'ohne Namen')} · ${esc(r.source || '')} · ${new Date(r.createdAt).toLocaleTimeString()} · ${g?.blueprint?.parts?.length || 0} Teile</span></div>
          <div class="muted">${esc(g?.moves?.map((m) => `${m.name} (${m.kind})`).join(' · ') || '')}</div>
          ${r.status === 'egg' ? `<button data-a="regenerate" data-id="${r.id}">Neu bauen</button><button data-a="reject" data-id="${r.id}">Ablehnen</button>` : ''}</div>`;
        grid.appendChild(card);
      }
    }
    document.getElementById('grid').addEventListener('click', async (e) => { const b = e.target.closest('button[data-a]'); if (!b) return; b.disabled = true; b.textContent = '…'; await call('mutation', 'eggs:adminAction', { key: KEY, eggId: b.dataset.id, action: b.dataset.a }); setTimeout(load, b.dataset.a === 'regenerate' ? 30000 : 500); });
    if (P.get('tests') === '1') document.getElementById('tests').checked = true;
    document.getElementById('reload').onclick = load; document.getElementById('tests').onchange = load;
    const start = () => load().catch((e) => { document.getElementById('sum').textContent = 'Fehler: ' + e.message; });
    if (KEY || P.get('file')) start();
    else { const f = document.createElement('form'); f.style.cssText = 'padding:24px'; f.innerHTML = '<input type="password" placeholder="Admin-Schlüssel" style="padding:8px;border:2px solid #111;border-radius:8px;width:220px"> <button>Öffnen</button>'; document.body.appendChild(f); f.onsubmit = (e) => { e.preventDefault(); KEY = f.querySelector('input').value.trim(); try { sessionStorage.setItem('snappymon-admin', KEY); } catch {} f.remove(); start(); }; }
  </script>
</body>
</html>
