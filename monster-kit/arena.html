<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Snappymon · Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #1b1f1d; overflow: hidden; }
    #stage { position: absolute; inset: 0; }
    #stage.portrait { left: 50%; right: auto; transform: translateX(-50%); aspect-ratio: 9 / 16; height: 100%; }
    #hint { position: fixed; left: 10px; top: 50%; color: #8a9; font: 12px system-ui; max-width: 180px; }
    .over { position: absolute; left: 6%; right: 6%; text-align: center; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 700; color: #fff; -webkit-text-stroke: 5px #2b2523; paint-order: stroke fill; pointer-events: none; opacity: 0; transition: opacity .35s; z-index: 5; }
    .over.on { opacity: 1; }
    #hook { top: 20%; font-size: 3.1vh; line-height: 1.15; }
    #cta { bottom: 13%; font-size: 3vh; line-height: 1.2; }
    #cta b { display: inline-block; margin-top: .5vh; padding: .3em .8em; border-radius: 999px; background: #ffd60a; color: #111; -webkit-text-stroke: 0; font-size: 3.6vh; border: .35vh solid #111; box-shadow: .5vh .5vh 0 #111; }
  </style>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
  <div id="stage"><div id="hook" class="over"></div><div id="cta" class="over"></div></div>
  <div id="hint"></div>
  <script type="module">
    // Für Videos: ui=1.4 (größere Schrift) · photos=0 (ohne Ursprungsfotos) · manual=1 (Bild für Bild, siehe prep/video/render.mjs) · hook=Text beim Intro · cta=Text nach dem Sieg (z. B. snappymon.com) · owner=Trainername (nur dessen Monster, mit src=today&test=1)
    // Parameter: ?src=test|today|royale (round=-1 Finale, 0.. Vorrunde)  n=16  seed=7  cam=auto|tilt|top|follow  follow=<id>  speed=1  intro=3  stage=9x16
    import { createArena } from './arena.js';
    import { genomeFromAI } from './genome-spec.js';
    import { statsFromTraits } from './battle.js';

    const P = new URLSearchParams(location.search);
    const CONVEX = P.get('convex') || 'https://superb-buzzard-616.convex.cloud';
    const N = Number(P.get('n') || 16);
    const stage = document.getElementById('stage');
    if (P.get('stage') === '9x16') stage.className = 'portrait'; else document.getElementById('hint').remove();

    let SEED = Number(P.get('seed') || 7); let DAY = P.get('day') || undefined; let TITLE = P.get('title') || undefined;
    async function convexQuery(path, args) {
      const res = await fetch(`${CONVEX}/api/query`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path, args, format: 'json' }) });
      return (await res.json()).value;
    }
    async function loadEntrants() {
      if (P.get('src') === 'royale') { // gespeicherte Runde der letzten Royale: round=-1 ist das Finale, sonst die Vorrunde
        const r = await convexQuery('royale:round', { index: Number(P.get('round') ?? -1) });
        if (!r) return [];
        SEED = r.seed; DAY = r.dayElement || undefined; TITLE = TITLE || (r.isFinal ? `${r.title} · FINAL` : `${r.title} · HEAT ${r.index + 1}`);
        return r.entrants;
      }
      if (P.get('src') === 'today') { // echte Monster der letzten 24 h aus Convex
        const res = await fetch(`${CONVEX}/api/query`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: 'monsters:listToday', args: { since: Date.now() - 24 * 3600 * 1000, includeTest: P.get('test') === '1' }, format: 'json' }) });
        const j = await res.json();
        const owner = P.get('owner');
        return (j.value || []).filter((m) => !owner || (m.ownerName || '').toLowerCase() === owner.toLowerCase()).slice(0, N).reverse().map((m) => ({ id: m._id, name: m.name, element: m.element, stats: m.stats, traits: m.genome?.traits, moves: m.genome?.moves, genome: m.genome, photoUrl: m.photoUrl, ownerName: m.ownerName }));
      }
      const rows = await (await fetch('./test-genomes.json')).json();
      const out = [];
      for (let i = 0; i < N; i++) { const r = rows[i % rows.length]; const g = genomeFromAI(r.genome, 3000 + i); const twin = i >= rows.length; out.push({ id: 't' + i, name: twin ? g.name + ' II' : g.name, element: g.element, stats: statsFromTraits(g.traits), traits: g.traits, moves: g.moves, genome: g, photoUrl: r.image }); }
      return out;
    }

    const entrants = await loadEntrants();
    if (P.get('photos') === '0') for (const e of entrants) e.photoUrl = null; // z. B. für Testmonster mit fremden Fotos
    const arena = createArena(stage, {
      entrants, seed: SEED, dayElement: DAY, camera: P.get('cam') || 'auto', followId: P.get('follow') || null,
      speed: Number(P.get('speed') || 1), intro: Number(P.get('intro') ?? 3), title: TITLE, controls: P.get('controls') !== '0', manual: P.get('manual') === '1', uiScale: Number(P.get('ui') || 1),
      onEnd: (r) => { console.log('[arena] end', JSON.stringify(r)); window.__arenaDone = true; if (P.get('cta')) arena.later(() => { const c = document.getElementById('cta'); c.innerHTML = `snap anything. hatch a monster.<br><b>${P.get('cta')}</b>`; c.classList.add('on'); }, 1800); },
      onEvent: (e) => { if (e.type === 'cast') document.getElementById('hook').classList.remove('on'); },
    });
    if (P.get('hook')) { const h = document.getElementById('hook'); h.textContent = P.get('hook'); h.classList.add('on'); }
    window.arena = arena; window.__arenaStep = (ms) => arena.step(ms);
    (document.fonts?.ready || Promise.resolve()).then(() => { window.__arenaReady = true; });
    addEventListener('keydown', (e) => { if (e.code === 'Space') arena.restart(); if (e.key >= '1' && e.key <= '4') arena.setCamera(['auto', 'tilt', 'top', 'follow'][Number(e.key) - 1]); });
    addEventListener('error', (e) => console.log('[arena] error', e.message));
    console.log('[arena] ready', entrants.length);
  </script>
</body>
</html>
