<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>monster-kit · Test 1</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e8f1ec; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; }
    #ui { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; }
    button { border: 0; border-radius: 999px; padding: 8px 14px; background: #2b2523; color: #fff; font-weight: 600; cursor: pointer; }
    #labels { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; justify-content: space-around; color: #2b2523; font-weight: 700; pointer-events: none; }
  </style>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
  <div id="ui"><button id="presets">Presets</button><button id="shuffle">Zufall</button><button id="fotos">Fotos ▶</button><button id="gold">Gold</button></div>
  <div id="labels"></div>
  <script type="module">
    import * as THREE from 'three';
    import { buildMonster, updateMonster, PRESETS, randomGenome, genomeFromAI, setMonsterStyle } from './monster.js';
    { const q = new URLSearchParams(location.search); setMonsterStyle({ toon: q.get('toon') === '1', outline: q.has('outline') ? Number(q.get('outline')) : 0.04 }); }

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene(); scene.background = new THREE.Color('#e8f1ec');
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    scene.add(new THREE.HemisphereLight('#ffffff', '#cfdcd4', 1.5));
    const sun = new THREE.DirectionalLight('#ffffff', 2.0); sun.position.set(-3, 5, 4); scene.add(sun);
    const fill = new THREE.DirectionalLight('#fff4ec', 0.9); fill.position.set(1.5, 1.5, 6); scene.add(fill);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({ color: '#e8f1ec' })); floor.rotation.x = -Math.PI / 2; floor.position.y = -0.001; scene.add(floor);

    let monsters = []; let count = 4;
    function show(genomes) {
      count = genomes.length;
      monsters.forEach((m) => scene.remove(m)); monsters = [];
      const gap = 2.9; const start = -((genomes.length - 1) * gap) / 2;
      genomes.forEach((g, i) => { const m = buildMonster(g); m.position.x = start + i * gap; scene.add(m); monsters.push(m); });
      resize();
      document.getElementById('labels').innerHTML = genomes.map((g) => `<span style="text-align:center">${g.photo ? `<img src="${g.photo}" style="height:70px;border-radius:10px;display:block;margin:0 auto 4px">` : ''}${g.name}</span>`).join('');
    }
    let page = 0;
    async function fotos() {
      const rows = await (await fetch('./test-genomes.json?' + Date.now())).json();
      const from = (page * 5) % rows.length; page++;
      show(rows.slice(from, from + 5).map((r, i) => ({ ...genomeFromAI(r.genome, 1000 + from + i), photo: r.image })));
    }
    document.getElementById('fotos').onclick = fotos;
    document.getElementById('gold').onclick = () => show(PRESETS.map((g) => ({ ...g, golden: true })));
    function resize() {
      const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h); camera.aspect = w / h;
      const width = Math.max(8, count * 2.9 + 0.8); const d = width / (2 * Math.tan((camera.fov * Math.PI) / 360) * camera.aspect);
      camera.position.set(0, 2.2, Math.max(9, d)); camera.lookAt(0, 1.15, 0); camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize); resize();
    let seed = 1;
    document.getElementById('presets').onclick = () => show(PRESETS);
    document.getElementById('shuffle').onclick = () => show([0, 1, 2, 3].map(() => randomGenome(seed++ * 7919)));
    show(PRESETS);
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      monsters.forEach((m, i) => { updateMonster(m, t); m.rotation.y = Math.sin(t * 0.6 + i) * 0.35; });
      renderer.render(scene, camera);
    });
    window.__ok = true;
  </script>
</body>
</html>
