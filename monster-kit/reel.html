<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monster Arena · Reel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #1b1f1d; overflow: hidden; font-family: 'Fredoka', system-ui, sans-serif; }
    #stage { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); aspect-ratio: 9 / 16; height: 100%; overflow: hidden; background: linear-gradient(#eaf4ee, #d5e9de); }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    #stage > div, .pop { z-index: 2; }
    .layer { position: absolute; left: 0; right: 0; text-align: center; color: #2b2523; pointer-events: none; }
    #top { top: 6%; font-size: 4.2vh; font-weight: 700; line-height: 1.12; padding: 0 7%; }
    #name { bottom: 17%; font-size: 6.4vh; font-weight: 700; letter-spacing: 0.02em; opacity: 0; transition: opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1); transform: scale(.6); }
    #name.on { opacity: 1; transform: scale(1); }
    #sub { bottom: 12.5%; font-size: 2.6vh; font-weight: 600; opacity: 0; transition: opacity .3s; }
    #sub.on { opacity: .85; }
    .chip { display: inline-block; padding: .25em .8em; border-radius: 999px; color: #fff; font-size: 2.2vh; margin-right: .4em; vertical-align: middle; }
    #photo { position: absolute; left: 14%; right: 14%; top: 22%; aspect-ratio: 4 / 5; border-radius: 3vh; background: #fff center / cover no-repeat; box-shadow: 0 2vh 5vh rgba(0,0,0,.25); border: 1.2vh solid #fff; opacity: 0; transform: rotate(-3deg) scale(.9); transition: all .45s cubic-bezier(.3,1.4,.5,1); }
    #photo.on { opacity: 1; transform: rotate(-3deg) scale(1); }
    #photo.shrink { opacity: 0; transform: rotate(12deg) scale(.15) translateY(40vh); transition: all .5s ease-in; }
    #hp { top: 17%; display: none; padding: 0 6%; gap: 4%; }
    #hp.on { display: flex; }
    .bar { flex: 1; text-align: left; font-weight: 700; font-size: 2.3vh; }
    .bar .track { height: 1.6vh; border-radius: 1vh; background: rgba(43,37,35,.15); overflow: hidden; margin-top: .6vh; }
    .bar .fill { height: 100%; width: 100%; background: #4cc38a; transition: width .3s; }
    .pop { position: absolute; font-weight: 700; font-size: 4.5vh; color: #fff; -webkit-text-stroke: .35vh #2b2523; paint-order: stroke; animation: up 0.9s ease-out forwards; pointer-events: none; }
    @keyframes up { from { transform: translate(-50%, 0) scale(.6); opacity: 1; } 30% { transform: translate(-50%, -3vh) scale(1.15); } to { transform: translate(-50%, -10vh) scale(1); opacity: 0; } }
    #cta { bottom: 6%; font-size: 3vh; font-weight: 700; opacity: 0; transition: opacity .4s; }
    #cta.on { opacity: 1; }
    #cta b { display: inline-block; margin-top: .6vh; background: #2b2523; color: #fff; padding: .35em .9em; border-radius: 999px; font-size: 3.4vh; }
    #hint { position: fixed; bottom: 12px; left: 12px; color: #9aa; font: 13px system-ui; }
  </style>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
  <div id="stage">
    <div id="photo"></div>
    <div class="layer" id="top"></div>
    <div class="layer" id="hp"><div class="bar" id="hpA"><span></span><div class="track"><div class="fill"></div></div></div><div class="bar" id="hpB" style="text-align:right"><span></span><div class="track"><div class="fill"></div></div></div></div>
    <div class="layer" id="name"></div>
    <div class="layer" id="sub"></div>
    <div class="layer" id="cta"></div>
  </div>
  <div id="hint">Leertaste / Klick = Start · ?src=live&n=5&speed=1&url=monster-arena.expo.app</div>
  <script type="module">
    import * as THREE from 'three';
    import { buildMonster, updateMonster, genomeFromAI } from './monster.js';
    import { runBattle, statsFromTraits } from './battle.js';

    const P = new URLSearchParams(location.search);
    const N = Number(P.get('n') || 5); const SPEED = Number(P.get('speed') || 1);
    const URL_TEXT = P.get('url') || 'monster-arena.expo.app';
    const CONVEX = P.get('convex') || 'https://superb-buzzard-616.convex.cloud';
    const ELEMENT_COLORS = { fire: '#ff6b4a', water: '#3d9df3', plant: '#4cb867', metal: '#8c97a6', fluff: '#e98bc4', spirit: '#9a7bf0' };
    const $ = (id) => document.getElementById(id);
    const wait = (ms) => new Promise((r) => setTimeout(r, ms / SPEED));

    async function loadItems() {
      if (P.get('src') === 'live') {
        // Echte Fänge aus Convex (neueste zuerst)
        const res = await fetch(`${CONVEX}/api/query`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: P.get('fn') || 'monsters:listToday', args: {}, format: 'json' }) });
        const j = await res.json();
        return (j.value || []).filter((m) => m.photoUrl && m.genome).slice(0, N).map((m) => ({ photo: m.photoUrl, genome: m.genome, object: m.genome.object }));
      }
      const rows = await (await fetch('./test-genomes.json')).json();
      return rows.slice(0, N).map((r, i) => ({ photo: r.image, genome: genomeFromAI(r.genome, 2000 + i), object: r.genome.object }));
    }

    // --- three.js Bühne ---
    const stage = $('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio)); stage.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 9 / 16, 0.1, 100); camera.position.set(0, 2.3, 9.5); camera.lookAt(0, 1.2, 0);
    scene.add(new THREE.HemisphereLight('#ffffff', '#cfdcd4', 1.5));
    const sun = new THREE.DirectionalLight('#ffffff', 2.0); sun.position.set(-3, 5, 4); scene.add(sun);
    const fill = new THREE.DirectionalLight('#fff4ec', 0.9); fill.position.set(1.5, 1.5, 6); scene.add(fill);
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.3, 0.25, 10), new THREE.MeshStandardMaterial({ color: '#c3dccd', flatShading: true })); disc.position.y = -0.13; scene.add(disc);
    function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
    addEventListener('resize', resize); resize();

    const actors = new Set(); const tweens = [];
    function tween(dur, fn) { return new Promise((res) => tweens.push({ t0: performance.now(), dur: dur / SPEED, fn, res })); }
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const now = performance.now(); const t = clock.getElapsedTime();
      for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; const k = Math.min(1, (now - tw.t0) / tw.dur); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.res(); } }
      for (const a of actors) { if (a.userData.monster) updateMonster(a, t); if (a.userData.spin) a.rotation.y = Math.sin(t * 0.8) * 0.45; }
      renderer.render(scene, camera);
    });
    const ease = (k) => 1 - Math.pow(1 - k, 3);
    const elastic = (k) => k === 1 ? 1 : 1 + Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI) / 3);

    function makeEgg(color) {
      const g = new THREE.IcosahedronGeometry(0.75, 1);
      const pos = g.attributes.position; const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i); const k = 1 - 0.2 * Math.max(0, v.y / 0.75); pos.setXYZ(i, v.x * k, v.y * 1.3, v.z * k); }
      g.computeVertexNormals();
      const egg = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: new THREE.Color(color).lerp(new THREE.Color('#ffffff'), 0.55), flatShading: true }));
      for (let i = 0; i < 7; i++) { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.12, 0), new THREE.MeshStandardMaterial({ color, flatShading: true })); const a = i * 2.4; s.position.set(Math.cos(a) * 0.62, (i / 7 - 0.4) * 1.6, Math.sin(a) * 0.62 + 0.1); s.scale.z = 0.4; s.lookAt(0, s.position.y, 0); egg.add(s); }
      const root = new THREE.Group(); egg.position.y = 0.98; root.add(egg); return root;
    }
    function burst(color, y = 1.1) {
      const parts = [];
      for (let i = 0; i < 26; i++) { const m = new THREE.Mesh(new THREE.TetrahedronGeometry(0.08 + Math.random() * 0.1), new THREE.MeshStandardMaterial({ color: i % 3 ? color : '#ffffff', flatShading: true })); m.position.set(0, y, 0); m.userData.v = new THREE.Vector3((Math.random() - .5) * 6, Math.random() * 5 + 1, (Math.random() - .3) * 4); scene.add(m); parts.push(m); }
      return tween(900, (k) => { for (const m of parts) { m.position.addScaledVector(m.userData.v, 0.016); m.userData.v.y -= 0.18; m.rotation.x += 0.2; m.scale.setScalar(1 - k); } if (k >= 1) parts.forEach((m) => scene.remove(m)); });
    }
    function popText(text, xPct, yPct, color = '#fff') { const el = document.createElement('div'); el.className = 'pop'; el.textContent = text; el.style.left = xPct + '%'; el.style.top = yPct + '%'; el.style.color = color; stage.appendChild(el); setTimeout(() => el.remove(), 1000 / SPEED); }
    const chip = (el) => `<span class="chip" style="background:${ELEMENT_COLORS[el] || '#777'}">${el}</span>`;

    async function hatch(item, idx) {
      $('top').innerHTML = idx === 0 ? 'What if every object around you was secretly a monster?' : '';
      $('photo').style.backgroundImage = `url("${item.photo}")`; $('photo').className = 'on';
      $('sub').textContent = `this is ${item.object.toLowerCase().replace(/^an? /, 'a ')}`.slice(0, 48); $('sub').className = 'layer on';
      await wait(1300);
      $('photo').className = 'shrink'; $('sub').className = 'layer';
      const egg = makeEgg(item.genome.body?.color || '#f2a3b3'); scene.add(egg); actors.add(egg);
      await tween(350, (k) => egg.scale.setScalar(ease(k)));
      await tween(900, (k) => { egg.rotation.z = Math.sin(k * 28) * 0.18 * (0.4 + k); egg.position.y = Math.abs(Math.sin(k * 14)) * 0.08; });
      scene.remove(egg); actors.delete(egg); burst(item.genome.body?.color || '#f2a3b3');
      const mon = buildMonster(item.genome); mon.userData.spin = true; scene.add(mon); actors.add(mon);
      tween(700, (k) => mon.scale.setScalar(Math.max(0.01, elastic(k))));
      $('name').innerHTML = item.genome.name; $('name').className = 'layer on';
      $('sub').innerHTML = `${chip(item.genome.element)} born from ${item.object.toLowerCase().replace(/^an? /, 'a ')}`.slice(0, 160); $('sub').className = 'layer on';
      await wait(2000);
      $('name').className = 'layer'; $('sub').className = 'layer';
      await tween(250, (k) => mon.scale.setScalar(1 - k)); scene.remove(mon); actors.delete(mon);
    }

    async function battle(a, b) {
      $('top').innerHTML = 'then they fight. every day.';
      const ma = buildMonster(a.genome); const mb = buildMonster(b.genome);
      ma.position.x = -1.25; mb.position.x = 1.25; ma.rotation.y = 0.6; mb.rotation.y = -0.6; ma.scale.setScalar(0.8); mb.scale.setScalar(0.8);
      scene.add(ma, mb); actors.add(ma); actors.add(mb);
      const A = { id: 'a', name: a.genome.name, element: a.genome.element, traits: a.genome.traits, stats: statsFromTraits(a.genome.traits) };
      const B = { id: 'b', name: b.genome.name, element: b.genome.element, traits: b.genome.traits, stats: statsFromTraits(b.genome.traits) };
      const res = runBattle(A, B, 7);
      const start = res.events[0];
      $('hpA').querySelector('span').innerHTML = A.name; $('hpB').querySelector('span').innerHTML = B.name; $('hp').className = 'layer on';
      const setHp = (side, hp, max) => { const f = $(side === 'a' ? 'hpA' : 'hpB').querySelector('.fill'); f.style.width = `${(100 * hp) / max}%`; f.style.background = hp / max < 0.3 ? '#ff6b4a' : '#4cc38a'; };
      setHp('a', start.a.maxHp, start.a.maxHp); setHp('b', start.b.maxHp, start.b.maxHp);
      for (const e of res.events.slice(1)) {
        const att = e.by === 'a' ? ma : mb; const def = e.by === 'a' ? mb : ma; const dir = e.by === 'a' ? 1 : -1; const x0 = att.position.x;
        if (e.type === 'hit') {
          await tween(160, (k) => { att.position.x = x0 + dir * 0.7 * Math.sin(k * Math.PI); });
          const dx0 = def.position.x; tween(260, (k) => { def.position.x = dx0 + Math.sin(k * 30) * 0.06 * (1 - k); });
          setHp('a', e.hpA, start.a.maxHp); setHp('b', e.hpB, start.b.maxHp);
          popText(`-${e.dmg}`, e.by === 'a' ? 70 : 30, 38, e.crit ? '#ffd23f' : '#fff');
          if (e.crit) popText('CRIT!', 50, 30, '#ffd23f'); else if (e.eff > 1) popText('super effective!', 50, 30, '#4cc38a');
          await wait(330);
        } else if (e.type === 'dodge') {
          const d = e.by === 'a' ? ma : mb; const z0 = d.position.z; popText('dodge!', e.by === 'a' ? 30 : 70, 38, '#9ff3ff');
          await tween(300, (k) => { d.position.z = z0 - Math.sin(k * Math.PI) * 0.8; });
        } else if (e.type === 'ko') {
          const l = e.who === 'a' ? ma : mb; popText('K.O.!', 50, 30, '#ff6b4a');
          await tween(500, (k) => { l.rotation.z = (e.who === 'a' ? 1 : -1) * k * 1.4; l.scale.setScalar(0.8 * (1 - 0.3 * k)); });
        } else if (e.type === 'end') {
          const w = e.winner === 'a' ? ma : mb; burst('#ffd23f', 1.4);
          const y0 = w.position.y; await tween(600, (k) => { w.position.y = y0 + Math.sin(k * Math.PI * 2) ** 2 * 0.5; });
        }
      }
      await wait(500);
      $('hp').className = 'layer'; scene.remove(ma, mb); actors.delete(ma); actors.delete(mb);
    }

    async function outro(items) {
      $('top').innerHTML = 'what does your stuff turn into?';
      const ms = items.slice(0, 5).map((it, i, arr) => { const m = buildMonster(it.genome); m.scale.setScalar(0.62); m.position.set((i - (arr.length - 1) / 2) * 1.05, 0, i % 2 ? -0.6 : 0.2); scene.add(m); actors.add(m); return m; });
      await tween(500, (k) => ms.forEach((m) => m.scale.setScalar(0.62 * elastic(k))));
      $('cta').innerHTML = `snap something. hatch a monster. royale at 4pm.<br><b>${URL_TEXT}</b>`; $('cta').className = 'layer on';
    }

    let started = false;
    async function run() {
      if (started) return; started = true; $('hint').remove();
      const items = await loadItems();
      for (let i = 0; i < items.length; i++) await hatch(items[i], i);
      if (items.length >= 2) await battle(items[0], items[1]);
      await outro(items);
    }
    addEventListener('keydown', (e) => { if (e.code === 'Space') run(); });
    stage.addEventListener('click', run);
    window.__ok = true;
  </script>
</body>
</html>
